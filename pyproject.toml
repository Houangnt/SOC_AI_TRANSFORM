[project]
name = "SOC_AI_TRANSFORM"
version = "0.1.4"
description = "AI agent demo with a local dashboard, Gemini chat, tools and memory."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Houangnt" }]
requires-python = ">=3.11"
keywords = ["ai-agent", "llm", "agent-framework", "local-first", "llmops", "memory", "eval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.urls]
Repository = "https://github.com/Houangnt/SOC_AI_TRANSFORM"
Author = "https://github.com/Houangnt"

[project.scripts]
soc-ai-transform = "SOC_AI_TRANSFORM.__main__:main"
SOC_AI_TRANSFORM = "SOC_AI_TRANSFORM.__main__:main"

[project.optional-dependencies]
asr = [
    "torch>=2.6,<3",
    "transformers>=4.48,<5",
    "peft>=0.14,<0.19",
    "soundfile>=0.13",
    "scipy>=1.13",
]

eval = [
    "pytest>=8.0",
    "deepeval>=2.0",
]

tracing = [
    "arize-phoenix>=7.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]

telegram = [
    "python-telegram-bot>=21.0",
]

gcal = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-httplib2>=0.2",
    "httplib2>=0.22",
    "google-auth-oauthlib>=1.0",
]

youtube = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
]

discord = [
    "discord.py>=2.4",
]

whatsapp = [
    "httpx>=0.25",
]

voice = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.24",
]

voice-neural = [
    "kokoro>=0.9",
    "soundfile>=0.12",
]

supabase = [
    "supabase>=2.0",
]

arena = [
    "mem0ai>=2.0",
    "zep-cloud>=2.0",
    "langmem>=0.0.30",
    "langgraph>=0.3",
]

notion = [
    "notion-client>=2.5",
]

mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff==0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "docs", "examples",
    ".claude", ".agents", ".pi", ".deepeval", ".github",
    "SOC_AI_TRANSFORM/lifemate/business_skills",
]

[tool.hatch.build.targets.wheel]
packages = ["SOC_AI_TRANSFORM"]
exclude = ["SOC_AI_TRANSFORM/lifemate/business_skills/**"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "SOC_AI_TRANSFORM/skills"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "BLE001",
    "DTZ001", "DTZ005", "DTZ011",
    "S110",
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"SOC_AI_TRANSFORM/**" = ["N999"]
